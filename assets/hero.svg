<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="Animated 3D isometric silicon chip with the name DRACSINFI19">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset=".55" stop-color="#071A2F"/><stop offset="1" stop-color="#0B3048"/></linearGradient>
<linearGradient id="tg" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#00D9FF"/></linearGradient>
<linearGradient id="pcbT" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A2A47"/><stop offset="1" stop-color="#0E4166"/></linearGradient>
<linearGradient id="bodyT" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1E2E47"/><stop offset="1" stop-color="#2B4263"/></linearGradient>
<radialGradient id="dieT" cx=".5" cy=".5" r=".7"><stop offset="0" stop-color="#9FF4FF"/><stop offset="1" stop-color="#00A9CC"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#00D9FF" stroke-opacity=".07"/></pattern>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="clip"><rect width="960" height="400" rx="18"/></clipPath>
<g id="tr">
<path d="M0.65 -0.45 H0.82 L0.92 -0.35"/><path d="M0.65 -0.15 H0.9"/><path d="M0.65 0.15 H0.8 L0.9 0.25"/><path d="M0.65 0.45 H0.9"/>
</g>
<g id="pd" fill="#00D9FF">
<circle cx="0.92" cy="-0.35" r="0.035"/><circle cx="0.9" cy="-0.15" r="0.035"/><circle cx="0.9" cy="0.25" r="0.035"/><circle cx="0.9" cy="0.45" r="0.035"/>
</g>
</defs>
<style>
.m{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace}
.flow{stroke-dasharray:6 10;animation:dash 1.6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
.orb{stroke-dasharray:3 12;animation:dash 3s linear infinite}
.float{animation:fl 4.5s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.pulse{animation:pu 2.2s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:.7}50%{opacity:1}}
.shadow{animation:sh 4.5s ease-in-out infinite;transform-origin:660px 372px}
@keyframes sh{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(.9);opacity:.3}}
.scan{animation:sc 6s linear infinite}
@keyframes sc{from{transform:translateY(-60px)}to{transform:translateY(440px)}}
.rise{animation:ri 7s linear infinite}
@keyframes ri{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-320px);opacity:0}}
.in{animation:inn .9s ease-out both}
@keyframes inn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.d1{animation-delay:.1s}.d2{animation-delay:.3s}.d3{animation-delay:.5s}.d4{animation-delay:.7s}.d5{animation-delay:.9s}
.cur{animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
</style>
<g clip-path="url(#clip)">
<rect width="960" height="400" fill="url(#bg)"/>
<rect width="960" height="400" fill="url(#grid)"/>
<rect class="scan" y="0" width="960" height="2" fill="#00D9FF" opacity=".18"/>
<g fill="#00D9FF">
<circle class="rise" cx="470" cy="380" r="1.6" style="animation-delay:0s"/>
<circle class="rise" cx="540" cy="390" r="1.2" style="animation-delay:1.2s"/>
<circle class="rise" cx="610" cy="385" r="1.8" style="animation-delay:2.4s"/>
<circle class="rise" cx="700" cy="392" r="1.3" style="animation-delay:3.6s"/>
<circle class="rise" cx="780" cy="388" r="1.7" style="animation-delay:4.8s"/>
<circle class="rise" cx="860" cy="394" r="1.2" style="animation-delay:6s"/>
<circle class="rise" cx="910" cy="380" r="1.5" style="animation-delay:2s"/>
</g>
<path class="orb" d="M410 240 A250 125 0 0 1 910 240" fill="none" stroke="#7C3AED" stroke-width="2" opacity=".5"/>
<ellipse class="shadow" cx="660" cy="372" rx="190" ry="26" fill="#00D9FF" filter="url(#soft)"/>
<g class="float">
<polygon points="460,266 660,366 860,266 860,250 660,350 460,250" fill="#06182B"/>
<polygon points="460,250 660,350 660,366 460,266" fill="#06182B" stroke="#00D9FF" stroke-opacity=".25"/>
<polygon points="660,350 860,250 860,266 660,366" fill="#0A2238" stroke="#00D9FF" stroke-opacity=".25"/>
<polygon points="660,150 860,250 660,350 460,250" fill="url(#pcbT)" stroke="#00D9FF" stroke-opacity=".5"/>
<g transform="matrix(100 50 -100 50 660 250)" fill="none" stroke="#00D9FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<g class="flow" style="vector-effect:non-scaling-stroke"><use href="#tr" style="vector-effect:non-scaling-stroke"/><use href="#tr" transform="rotate(90)" style="vector-effect:non-scaling-stroke"/><use href="#tr" transform="rotate(180)" style="vector-effect:non-scaling-stroke"/><use href="#tr" transform="rotate(270)" style="vector-effect:non-scaling-stroke"/></g>
<use href="#pd"/><use href="#pd" transform="rotate(90)"/><use href="#pd" transform="rotate(180)"/><use href="#pd" transform="rotate(270)"/>
</g>
<polygon points="530,216 660,281 660,315 530,250" fill="#0F1B2E" stroke="#00D9FF" stroke-opacity=".25"/>
<polygon points="660,281 790,216 790,250 660,315" fill="#172845" stroke="#00D9FF" stroke-opacity=".25"/>
<polygon points="660,151 790,216 660,281 530,216" fill="url(#bodyT)" stroke="#00D9FF" stroke-opacity=".55"/>
<g transform="matrix(65 32.5 -65 32.5 660 216)"><text class="m" x="-0.95" y="0.88" font-size="0.12" fill="#7FA8C4">DRACSINFI19 // REV.A</text></g>
<ellipse class="pulse" cx="660" cy="208" rx="70" ry="34" fill="#00D9FF" opacity=".45" filter="url(#soft)"/>
<polygon points="598,216 660,247 722,216 722,208 660,239 598,208" fill="#007C99"/>
<polygon points="598,208 660,239 660,247 598,216" fill="#006680"/>
<polygon points="660,239 722,208 722,216 660,247" fill="#008AAA"/>
<g transform="matrix(31 15.5 -31 15.5 660 208)">
<rect x="-1" y="-1" width="2" height="2" fill="url(#dieT)"/>
<path d="M-1 -.33H1M-1 .33H1M-.33 -1V1M.33 -1V1" stroke="#FFFFFF" stroke-opacity=".25" stroke-width=".02" fill="none"/>
<text class="m" x="0" y=".27" font-size=".75" font-weight="800" text-anchor="middle" fill="#00222E">4:2</text>
</g>
</g>
<path class="orb" d="M410 240 A250 125 0 0 0 910 240" fill="none" stroke="#00D9FF" stroke-width="2" opacity=".8" filter="url(#glow)"/>
<g class="m">
<text class="in d1" x="48" y="88" font-size="13" letter-spacing="4" fill="#00D9FF">&#9673; SYSTEM ONLINE</text>
<text class="in d2" x="46" y="158" font-size="58" font-weight="800" fill="url(#tg)">DRACSINFI19</text>
<text class="in d3" x="48" y="196" font-size="16" fill="#9FE9FF">Engineering the hardware behind everything<tspan class="cur" fill="#00D9FF">_</tspan></text>
<g class="in d4" font-size="12">
<rect x="48" y="226" width="56" height="28" rx="14" fill="#00D9FF" fill-opacity=".12" stroke="#00D9FF"/><text x="76" y="244" text-anchor="middle" fill="#CFF8FF">VLSI</text>
<rect x="112" y="226" width="122" height="28" rx="14" fill="#7C3AED" fill-opacity=".15" stroke="#7C3AED"/><text x="173" y="244" text-anchor="middle" fill="#E4D9FF">RTL &#183; VERILOG</text>
<rect x="242" y="226" width="150" height="28" rx="14" fill="#FF8C00" fill-opacity=".12" stroke="#FF8C00"/><text x="317" y="244" text-anchor="middle" fill="#FFE2BD">APPROX. COMPUTING</text>
<rect x="48" y="264" width="144" height="28" rx="14" fill="#00D9FF" fill-opacity=".12" stroke="#00D9FF"/><text x="120" y="282" text-anchor="middle" fill="#CFF8FF">EMBEDDED &#183; ESP32</text>
<rect x="200" y="264" width="88" height="28" rx="14" fill="#7C3AED" fill-opacity=".15" stroke="#7C3AED"/><text x="244" y="282" text-anchor="middle" fill="#E4D9FF">RESEARCH</text>
</g>
<text class="in d5" x="48" y="340" font-size="13" fill="#7FA8C4">ECE student &#183; Cambridge Institute of Technology, Bengaluru</text>
</g>
<rect x=".5" y=".5" width="959" height="399" rx="18" fill="none" stroke="#00D9FF" stroke-opacity=".35"/>
</g>
</svg>
